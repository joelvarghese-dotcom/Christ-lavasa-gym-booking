<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusFit | CHRIST Lavasa Gym</title>
<style>
:root{--bg:#f4f7fc;--surface:#fff;--text:#17233c;--muted:#64748b;--primary:#2458d3;--primary2:#173fa7;--border:#e2e8f0;--soft:#eaf0ff;--good:#12805c;--bad:#c43e4d;--shadow:0 14px 40px rgba(27,48,91,.09)}
body.dark{--bg:#0d1424;--surface:#151f33;--text:#edf3ff;--muted:#a5b2ca;--primary:#7da2ff;--primary2:#a7beff;--border:#2b3851;--soft:#202f4e;--good:#63d8ac;--bad:#ff8290;--shadow:0 14px 40px rgba(0,0,0,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;transition:background .2s,color .2s}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1160px;margin:auto;padding:0 24px}.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:18px;letter-spacing:-.4px}.logo{height:42px;width:42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#275be0,#42b6c9);font-size:22px}.navlinks{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.navlinks button,.linkbtn{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:650}.navlinks button:hover,.navlinks button.active{background:var(--soft);color:var(--primary)}.btn{border:0;background:var(--primary);color:#fff;padding:12px 17px;border-radius:11px;font-weight:750;box-shadow:0 5px 14px rgba(36,88,211,.17)}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:var(--soft);color:var(--primary);box-shadow:none}.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);box-shadow:none}.btn.danger{background:var(--bad);color:#fff}.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px}.hero{padding:58px 0 36px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:8px 11px;border-radius:99px}.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.04;letter-spacing:-2px;margin:20px 0 16px}.gradient{background:linear-gradient(100deg,var(--primary),#29a8ba);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:17px;line-height:1.7;color:var(--muted);max-width:620px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.heroart{min-height:310px;border-radius:28px;padding:25px;background:linear-gradient(145deg,#142b58,#2462c9 55%,#37a7b5);position:relative;overflow:hidden;color:white;box-shadow:var(--shadow)}.heroart:before,.heroart:after{content:"";position:absolute;border:1px solid #ffffff35;border-radius:50%;width:290px;height:290px;right:-65px;top:-85px}.heroart:after{width:200px;height:200px;right:5px;top:-40px}.articon{font-size:94px;position:absolute;right:38px;bottom:35px;filter:drop-shadow(0 15px 20px #06133277)}.arttitle{font-size:23px;font-weight:800;max-width:210px;position:relative;z-index:1}.artsub{opacity:.8;line-height:1.5;max-width:220px;position:relative;z-index:1}.artbadge{display:inline-block;margin-top:22px;background:#ffffff22;border:1px solid #ffffff55;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:700}.section{padding:26px 0 46px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.sectionhead h2{margin:0;font-size:26px;letter-spacing:-.6px}.sectionhead p{color:var(--muted);margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:21px;box-shadow:var(--shadow)}.featureicon{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:var(--soft);font-size:22px}.card h3{margin:14px 0 8px}.card p{margin:0;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 26px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:28px;margin-top:7px}.page{padding:36px 0 60px;min-height:65vh}.page-title{margin:0 0 8px;font-size:32px;letter-spacing:-.8px}.sub{color:var(--muted);line-height:1.6;margin-top:0}.formcard{max-width:520px;margin:20px auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.formcard h1{margin:0 0 8px}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}.full{width:100%}.notice{padding:13px 15px;border-radius:12px;background:var(--soft);color:var(--text);line-height:1.5;font-size:13px;margin:15px 0}.notice.warning{background:color-mix(in srgb,#e8a23a 14%,var(--surface));border:1px solid color-mix(in srgb,#e8a23a 40%,var(--border))}.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.slot{border:1px solid var(--border);background:var(--surface);border-radius:17px;padding:18px}.slot.fullslot{opacity:.82}.slot h3{margin:0 0 7px}.slot .time{font-weight:800;font-size:17px}.slot .muted{color:var(--muted);font-size:13px;margin:10px 0}.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:6px 9px;background:var(--soft);color:var(--primary)}.pill.good{background:color-mix(in srgb,#18a879 14%,var(--surface));color:var(--good)}.pill.bad{background:color-mix(in srgb,#dc4356 13%,var(--surface));color:var(--bad)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px}.table{border-collapse:collapse;width:100%;min-width:560px}.table th,.table td{text-align:left;padding:15px;border-bottom:1px solid var(--border);font-size:14px}.table th{color:var(--muted);background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.table tr:last-child td{border-bottom:0}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .emoji{font-size:40px}.footer{background:var(--surface);border-top:1px solid var(--border);padding:28px 0;color:var(--muted)}.footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footlinks{display:flex;gap:18px;flex-wrap:wrap}.footlinks button{border:0;background:none;color:var(--muted);padding:0}.footlinks button:hover{color:var(--primary)}.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:350px;background:var(--text);color:var(--surface);padding:14px 18px;border-radius:13px;box-shadow:var(--shadow);display:none}.toast.show{display:block;animation:pop .2s ease}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.separator{text-align:center;color:var(--muted);font-size:13px;margin-top:17px}.separator button{color:var(--primary);font-weight:750;border:0;background:none}.hero-mini{border-radius:18px;padding:22px;background:var(--soft);margin-bottom:24px}.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profileitem{padding:15px;border:1px solid var(--border);border-radius:13px}.profileitem small{display:block;color:var(--muted);margin-bottom:6px}.profileitem strong{overflow-wrap:anywhere}
@media(max-width:850px){.hero{grid-template-columns:1fr}.heroart{min-height:250px}.grid,.slotgrid{grid-template-columns:repeat(2,1fr)}.nav{height:auto;min-height:74px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.navlinks{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.navlinks button{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{padding:0 16px}.hero{padding-top:35px}.hero h1{letter-spacing:-1px}.grid,.slotgrid,.stats,.profilegrid{grid-template-columns:1fr}.sectionhead{align-items:start;flex-direction:column}.formcard{padding:22px 18px}.brand{font-size:16px}.logo{width:38px;height:38px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav">
  <div class="brand"><div class="logo">✦</div><span>CampusFit <span style="color:var(--muted);font-weight:600">/ Lavasa</span></span></div>
  <nav class="navlinks" id="navlinks"></nav>
  <div class="row" style="gap:8px"><button class="iconbtn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">☾</button><button class="btn" id="authTop" onclick="go('login')">Log in</button></div>
</div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap footrow"><div><strong style="color:var(--text)">CampusFit · CHRIST Lavasa</strong><div class="small" style="margin-top:7px">A student-focused gym slot booking prototype.</div></div><div class="footlinks"><button onclick="go('gym')">Gym information</button><button onclick="go('help')">Help & FAQ</button><button onclick="go('contact')">Contact</button></div><div class="small">Prototype for demonstration · Not an official university service</div></div></footer>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateLabel=()=>new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
const getUsers=()=>JSON.parse(localStorage.getItem('cf_users')||'{}');
const setUsers=x=>localStorage.setItem('cf_users',JSON.stringify(x));
const getBookings=()=>JSON.parse(localStorage.getItem('cf_bookings')||'[]');
const setBookings=x=>localStorage.setItem('cf_bookings',JSON.stringify(x));
const getWait=()=>JSON.parse(localStorage.getItem('cf_waitlist')||'[]');
const setWait=x=>localStorage.setItem('cf_waitlist',JSON.stringify(x));
const current=()=>localStorage.getItem('cf_current')||'';
const setCurrent=x=>x?localStorage.setItem('cf_current',x):localStorage.removeItem('cf_current');
const slotsForToday=()=>{
 const d=new Date(), day=d.getDay(), weekday=day>=1&&day<=5;
 let times=weekday?['05:00','06:00','07:00','17:00','18:00','19:00','20:00']:['05:00','06:00','07:00','08:00'];
 // Weekend evening hours were not specified; keep the morning schedule configurable.
 if(!weekday) times=times.concat(['17:00','18:00','19:00','20:00']);
 return times.map(start=>({id:today()+'_'+start,start,end:String(Number(start.slice(0,2))+1).padStart(2,'0')+':'+start.slice(3)}));
};
function fmt(t){let [h,m]=t.split(':').map(Number);let ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
function timeForSlot(slot){const [y,mo,d]=slot.id.split('_')[0].split('-').map(Number);const [h,m]=slot.start.split(':').map(Number);return new Date(y,mo-1,d,h,m)}
function bookable(slot){const now=new Date(),start=timeForSlot(slot);return now>=new Date(start.getTime()-30*60000)&&now<start}
function cancelable(slot){return new Date()<new Date(timeForSlot(slot).getTime()-10*60000)}
function count(slot){return getBookings().filter(b=>b.slotId===slot.id&&b.status==='confirmed').length}
function myBooking(){return getBookings().find(b=>b.user===current()&&b.date===today()&&b.status==='confirmed')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function go(page){location.hash=page}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){const logged=!!current();const links=logged?[['home','Home'],['dashboard','Dashboard'],['book','Book a slot'],['bookings','My bookings'],['gym','Gym info'],['profile','Profile']]:[['home','Home'],['gym','Gym info']];$('#navlinks').innerHTML=links.map(([p,l])=>`<button class="${location.hash==='#'+p?'active':''}" onclick="go('${p}')">${l}</button>`).join('');$('#authTop').textContent=logged?'Log out':'Log in';$('#authTop').onclick=()=>logged?logout():go('login');$('#themeToggle').textContent=document.body.classList.contains('dark')?'☀':'☾'}
function logout(){setCurrent('');toast('You have been logged out.');go('home')}
function render(){nav();let page=location.hash.slice(1)||'home';if(!['home','login','signup','dashboard','book','bookings','gym','profile','help','contact'].includes(page))page='home';if(['dashboard','book','bookings','profile'].includes(page)&&!current())page='login';const app=$('#app');app.innerHTML=pages[page]();if(page==='book')renderSlots();if(page==='bookings')renderBookings();if(page==='dashboard')renderDashboard();if(page==='profile')renderProfile()}
const pages={
home:()=>`<div class="wrap"><section class="hero"><div><span class="eyebrow">✦ Student gym booking</span><h1>Your workout.<br><span class="gradient">Your time.</span></h1><p>Plan your gym visit with a simple slot booking experience designed for the CHRIST Lavasa campus community. Check availability before you go and spend less time guessing.</p><div class="actions">${current()?`<button class="btn" onclick="go('book')">Book a gym slot →</button><button class="btn secondary" onclick="go('dashboard')">My dashboard</button>`:`<button class="btn" onclick="go('signup')">Get started →</button><button class="btn secondary" onclick="go('login')">Student login</button>`}</div><p class="small">For prototype demonstration only. Membership verification is not connected.</p></div><div class="heroart"><div class="arttitle">Make time for your health.</div><p class="artsub">Simple reservations. Clear availability. Better planning.</p><span class="artbadge">● 20 places per one-hour slot</span><div class="articon">🏋️</div></div></section>
<section class="section"><div class="sectionhead"><div><h2>Built around your routine</h2><p>Everything you need to plan a gym visit in one place.</p></div></div><div class="grid"><article class="card"><div class="featureicon">🗓️</div><h3>Book with confidence</h3><p>See the day's available slots and reserve one one-hour visit.</p></article><article class="card"><div class="featureicon">👥</div><h3>Capacity-aware slots</h3><p>Each slot has a limit of 20 students, with a waiting list when full.</p></article><article class="card"><div class="featureicon">✉️</div><h3>Booking updates</h3><p>Review your booking status and see how email notifications fit into the proposed service.</p></article></div></section>
<section class="section"><div class="hero-mini row"><div><h2 style="margin:0 0 6px">Ready to plan today's workout?</h2><div class="sub" style="margin:0">Bookings open 30 minutes before each slot starts.</div></div><button class="btn" onclick="go(current()?'book':'login')">Check today's slots →</button></div></section></div>`,
login:()=>`<div class="wrap page"><form class="formcard" onsubmit="loginUser(event)"><div class="featureicon">🔐</div><h1 style="margin-top:16px">Welcome back</h1><p class="sub">Log in with your student registration number.</p><div class="field"><label for="loginReg">Student registration number</label><input id="loginReg" required autocomplete="username" placeholder="e.g. 24610001"></div><div class="field"><label for="loginPass">Password</label><input id="loginPass" required type="password" autocomplete="current-password" placeholder="Enter your password"></div><button class="btn full">Log in</button><div class="separator">New here? <button type="button" onclick="go('signup')">Create an account</button></div><div class="notice warning">Demo prototype: registration numbers are not checked against university records. Do not use a real or reused password.</div></form></div>`,
signup:()=>`<div class="wrap page"><form class="formcard" onsubmit="signupUser(event)"><div class="featureicon">✨</div><h1 style="margin-top:16px">Create your account</h1><p class="sub">Set up a demo student profile to explore booking.</p><div class="field"><label for="reg">Student registration number</label><input id="reg" required maxlength="40" autocomplete="username" placeholder="Enter registration number"></div><div class="field"><label for="email">Email address</label><input id="email" required type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="pass">Password</label><input id="pass" required minlength="6" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" required minlength="6" type="password" autocomplete="new-password" placeholder="Re-enter password"></div><button class="btn full">Create account</button><div class="separator">Already registered? <button type="button" onclick="go('login')">Log in</button></div><div class="notice warning">Prototype notice: account data is stored in this browser only and is not secure for real student information.</div></form></div>`,
dashboard:()=>`<div class="wrap page"><div class="sectionhead"><div><span class="eyebrow">Student space</span><h1 class="page-title" style="margin-top:13px">Your dashboard</h1><p class="sub">Here's your gym booking overview for ${dateLabel()}.</p></div><button class="btn" onclick="go('book')">+ Book a slot</button></div><div id="dashcontent"></div></div>`,
book:()=>`<div class="wrap page"><div class="sectionhead"><div><span class="eyebrow">Today's schedule</span><h1 class="page-title" style="margin-top:13px">Book a gym slot</h1><p class="sub">Choose an available one-hour slot. Maximum capacity: 20 students.</p></div><span class="pill">${safe(dateLabel())}</span></div><div class="notice">Booking opens 30 minutes before a slot starts. You can make one confirmed booking per day and cancel it up to 10 minutes before the start.</div><div id="slotStatus"></div><div id="slotgrid" class="slotgrid"></div><p class="small" style="margin-top:20px">Weekend evening hours are provisional in this prototype because official weekend evening timings have not been confirmed.</p></div>`,
bookings:()=>`<div class="wrap page"><div class="sectionhead"><div><span class="eyebrow">Your activity</span><h1 class="page-title" style="margin-top:13px">My bookings</h1><p class="sub">Review your reservations and waiting-list entries.</p></div><button class="btn" onclick="go('book')">Find a slot</button></div><div id="bookingContent"></div></div>`,
gym:()=>`<div class="wrap page"><span class="eyebrow">Plan your visit</span><h1 class="page-title" style="margin-top:13px">Gym information</h1><p class="sub">A quick guide to the proposed slot booking rules and operating schedule.</p><div class="grid" style="margin-top:24px"><div class="card"><div class="featureicon">⏱️</div><h3>One-hour sessions</h3><p>Each bookable session is one hour long, with a maximum of 20 students.</p></div><div class="card"><div class="featureicon">🎟️</div><h3>Booking rules</h3><p>Bookings open 30 minutes before a slot starts. One confirmed booking per student per day.</p></div><div class="card"><div class="featureicon">↩️</div><h3>Cancellation</h3><p>Cancel up to 10 minutes before your slot starts. If the slot is full, join the waiting list.</p></div></div><section class="section"><h2>Proposed operating hours</h2><p class="sub">These hours were supplied for the project and should be verified with the university before real use.</p><div class="tablewrap"><table class="table"><thead><tr><th>Day</th><th>Session</th><th>Hours</th></tr></thead><tbody><tr><td>Weekdays</td><td>Morning</td><td>5:00 AM – 8:00 AM</td></tr><tr><td>Weekdays</td><td>Evening</td><td>5:00 PM – 9:00 PM</td></tr><tr><td>Weekends</td><td>Morning</td><td>5:00 AM – 9:00 AM</td></tr><tr><td>Weekends</td><td>Evening</td><td>To be confirmed</td></tr></tbody></table></div><div class="notice warning">Eligibility note: the intended real service is for students with valid gym memberships. This prototype accepts any registration number and does not verify membership.</div></section></div>`,
profile:()=>`<div class="wrap page"><span class="eyebrow">Account</span><h1 class="page-title" style="margin-top:13px">Student profile</h1><p class="sub">Your demo account information.</p><div id="profileContent" class="card" style="max-width:700px;margin-top:22px"></div></div>`,
help:()=>`<div class="wrap page"><span class="eyebrow">Support</span><h1 class="page-title" style="margin-top:13px">Help & frequently asked questions</h1><p class="sub">Answers to common questions about the booking prototype.</p><div class="grid" style="margin-top:22px"><div class="card"><h3>When can I book?</h3><p>A slot becomes bookable 30 minutes before it begins and is available only on the current day.</p></div><div class="card"><h3>What if a slot is full?</h3><p>You can join the waiting list. The first eligible person is offered a cancelled place.</p></div><div class="card"><h3>Can I cancel?</h3><p>You can cancel a confirmed booking until 10 minutes before the slot begins.</p></div><div class="card"><h3>Will I receive an email?</h3><p>This frontend demo cannot send real emails. Email delivery needs a configured backend and email service.</p></div><div class="card"><h3>Is this an official university system?</h3><p>No. It is a prototype for demonstration and is not connected to university systems.</p></div><div class="card"><h3>Is my password secure?</h3><p>No real passwords should be used. Demo account data is stored in browser storage for this prototype.</p></div></div></div>`,
contact:()=>`<div class="wrap page"><span class="eyebrow">We're here to help</span><h1 class="page-title" style="margin-top:13px">Contact</h1><p class="sub">This is a classroom prototype. No official university contact details have been supplied.</p><div class="card" style="max-width:700px;margin-top:22px"><h3>Project support</h3><p>For this demonstration, contact details should be provided by the project team or authorized university department.</p><div class="notice">Do not treat this prototype as an official booking or support channel.</div><button class="btn secondary" onclick="go('help')">Read FAQs</button></div></div>`
};
function signupUser(e){e.preventDefault();let reg=$('#reg').value.trim(),email=$('#email').value.trim(),pass=$('#pass').value,confirm=$('#confirm').value;if(pass!==confirm){toast('Passwords do not match.');return}let users=getUsers();if(users[reg]){toast('That registration number already has a demo account. Please log in.');return}users[reg]={email,password:pass,created:new Date().toISOString()};setUsers(users);setCurrent(reg);toast('Demo account created.');go('dashboard')}
function loginUser(e){e.preventDefault();let reg=$('#loginReg').value.trim(),pass=$('#loginPass').value,users=getUsers();if(!users[reg]||users[reg].password!==pass){toast('Account not found or password incorrect. Create a demo account first.');return}setCurrent(reg);toast('Welcome back!');go('dashboard')}
function renderSlots(){let all=slotsForToday(),b=myBooking(),wait=getWait().filter(w=>w.user===current()&&w.date===today());$('#slotStatus').innerHTML=b?`<div class="notice">You already have a confirmed booking for <strong>${fmt(all.find(s=>s.id===b.slotId)?.start||'00:00')}</strong>. One confirmed booking per day.</div>`:wait.length?`<div class="notice">You are on a waiting list. You may not join another waiting list while waiting for a slot.</div>`:'';$('#slotgrid').innerHTML=all.map(s=>{let n=count(s),full=n>=20,booked=!!b,waiting=getWait().some(w=>w.slotId===s.id&&w.user===current()),open=bookable(s),start=timeForSlot(s),past=new Date()>=start;let status=full?'FULL':past?'STARTED':open?'BOOKING OPEN':'OPENS '+fmt(new Date(start.getTime()-30*60000).toTimeString().slice(0,5));let action='';if(b)action='<button class="btn secondary full" disabled>Daily limit reached</button>';else if(waiting)action='<button class="btn secondary full" disabled>On waiting list</button>';else if(wait.length)action='<button class="btn secondary full" disabled>Already waiting</button>';else if(past)action='<button class="btn outline full" disabled>Booking closed</button>';else if(!open)action=`<button class="btn outline full" disabled>Opens ${fmt(new Date(start.getTime()-30*60000).toTimeString().slice(0,5))}</button>`;else if(full)action=`<button class="btn secondary full" onclick="joinWait('${s.id}')">Join waiting list</button>`;else action=`<button class="btn full" onclick="makeBooking('${s.id}')">Book this slot</button>`;return `<article class="slot ${full?'fullslot':''}"><div class="row"><span class="pill ${full?'bad':n>=15?'':'good'}">${status}</span><span class="small">1 hour</span></div><h3 style="margin-top:17px">${fmt(s.start)} – ${fmt(s.end)}</h3><div class="time">${n}/20 <span class="small">places booked</span></div><div style="height:7px;background:var(--border);border-radius:99px;margin:13px 0;overflow:hidden"><div style="height:100%;width:${Math.min(n/20*100,100)}%;background:${full?'var(--bad)':'var(--primary)'};border-radius:99px"></div></div><div class="muted">${20-n} ${20-n===1?'place':'places'} remaining</div>${action}</article>`}).join('')}
function makeBooking(slotId){if(myBooking()){toast('You already have a confirmed booking today.');return}if(getWait().some(w=>w.user===current()&&w.date===today())){toast('Leave your current waiting list before booking another slot.');return}let s=slotsForToday().find(x=>x.id===slotId);if(!s||!bookable(s)){toast('Booking is not open for this slot yet.');return}if(count(s)>=20){toast('This slot is full. Join the waiting list.');renderSlots();return}let b=getBookings();b.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),user:current(),slotId,date:today(),status:'confirmed',created:new Date().toISOString()});setBookings(b);toast('Booking confirmed on this demo. Email delivery is not connected.');renderSlots()}
function joinWait(slotId){if(myBooking()){toast('You already have a confirmed booking today.');return}if(getWait().some(w=>w.user===current()&&w.date===today())){toast('You are already on a waiting list today.');return}let s=slotsForToday().find(x=>x.id===slotId);if(!s||!bookable(s)){toast('You can join the waiting list when booking opens.');return}if(count(s)<20){toast('A place is available. Book the slot instead.');renderSlots();return}let q=getWait();q.push({id:Date.now(),user:current(),slotId,date:today(),created:new Date().toISOString()});setWait(q);toast('You joined the waiting list.');renderSlots()}
function promote(slotId){let q=getWait(),index=q.findIndex(w=>w.slotId===slotId&&w.date===today());if(index<0)return;let candidate=q[index];if(myBookingFor(candidate.user)) {q.splice(index,1);setWait(q);promote(slotId);return}let s=slotsForToday().find(x=>x.id===slotId);if(!s||!cancelable(s)){return}let b=getBookings();b.push({id:String(Date.now()),user:candidate.user,slotId,date:today(),status:'confirmed',created:new Date().toISOString(),promoted:true});q.splice(index,1);setWait(q);setBookings(b)}
function myBookingFor(user){return getBookings().some(b=>b.user===user&&b.date===today()&&b.status==='confirmed')}
function cancelBooking(id){let b=getBookings(),target=b.find(x=>x.id===id);if(!target)return;let s=slotsForToday().find(x=>x.id===target.slotId);if(!s||!cancelable(s)){toast('Cancellation is closed 10 minutes before the slot starts.');return}target.status='cancelled';target.cancelled=new Date().toISOString();setBookings(b);promote(target.slotId);toast('Booking cancelled. The next eligible waiting-list student may be promoted.');renderBookings()}
function leaveWait(id){setWait(getWait().filter(w=>String(w.id)!==String(id)));toast('Removed from waiting list.');renderBookings()}
function renderBookings(){let b=getBookings().filter(x=>x.user===current()).sort((a,b)=>b.created.localeCompare(a.created)),q=getWait().filter(x=>x.user===current());let all=[...b.map(x=>({...x,kind:'booking'})),...q.map(x=>({...x,kind:'wait'}))];let labels={confirmed:'Confirmed',cancelled:'Cancelled'};$('#bookingContent').innerHTML=all.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead><tbody>${all.map(x=>{let s=slotsForToday().find(s=>s.id===x.slotId),time=s?`${fmt(s.start)} – ${fmt(s.end)}`:x.slotId.split('_')[1]||'—',can=x.kind==='booking'&&x.status==='confirmed'&&s&&cancelable(s);return `<tr><td>${safe(x.date)}</td><td>${safe(time)}</td><td><span class="pill ${x.kind==='wait'?'':'good'}">${x.kind==='wait'?'Waiting list':labels[x.status]||x.status}</span></td><td>${can?`<button class="btn danger" onclick="cancelBooking('${x.id}')">Cancel</button>`:x.kind==='wait'?`<button class="btn outline" onclick="leaveWait('${x.id}')">Leave list</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="card empty"><div class="emoji">🗓️</div><h3>No bookings yet</h3><p>When you book a slot, it will appear here.</p><button class="btn" onclick="go('book')">Browse today's slots</button></div>`}
function renderDashboard(){let b=myBooking(),q=getWait().find(w=>w.user===current()&&w.date===today()),all=slotsForToday(),n=all.reduce((a,s)=>a+count(s),0);$('#dashcontent').innerHTML=`<div class="stats"><div class="stat"><small>Slots today</small><strong>${all.length}</strong></div><div class="stat"><small>Places booked today</small><strong>${n}</strong></div><div class="stat"><small>Capacity per slot</small><strong>20</strong></div></div>${b?`<div class="card"><span class="pill good">Confirmed booking</span><h2>Your gym slot is reserved</h2><p class="sub">${safe(b.date)} · ${(()=>{let s=all.find(s=>s.id===b.slotId);return s?fmt(s.start)+' – '+fmt(s.end):b.slotId.split('_')[1]})()}</p><button class="btn secondary" onclick="go('bookings')">View booking details</button></div>`:q?`<div class="card"><span class="pill">Waiting list</span><h2>You're on the waiting list</h2><p class="sub">We'll show updates here when your status changes.</p><button class="btn secondary" onclick="go('bookings')">View status</button></div>`:`<div class="card"><h2>No slot booked yet</h2><p class="sub">Browse today's slots to see whether booking is open.</p><button class="btn" onclick="go('book')">Check availability →</button></div>`}<section class="section"><div class="sectionhead"><div><h2>Booking basics</h2><p>Remember these rules before choosing a slot.</p></div></div><div class="grid"><div class="card"><h3>One per day</h3><p>Only one confirmed slot per student each day.</p></div><div class="card"><h3>30-minute window</h3><p>Booking opens 30 minutes before the session starts.</p></div><div class="card"><h3>Cancel in time</h3><p>Cancellation closes 10 minutes before the start.</p></div></div></section>`}
function renderProfile(){let u=getUsers()[current()];$('#profileContent').innerHTML=`<div class="featureicon">👤</div><h2>${safe(current())}</h2><p class="sub">Student demo account</p><div class="profilegrid"><div class="profileitem"><small>Registration number</small><strong>${safe(current())}</strong></div><div class="profileitem"><small>Email address</small><strong>${safe(u?.email||'Not provided')}</strong></div><div class="profileitem"><small>Account type</small><strong>Prototype student</strong></div><div class="profileitem"><small>Membership verification</small><strong>Not connected</strong></div></div><div class="notice warning">This is a browser-only demonstration. Do not store real student data or passwords here.</div><button class="btn danger" onclick="logout()">Log out</button>`}

if(localStorage.getItem('cf_theme')==='dark')document.body.classList.add('dark');
window.addEventListener('hashchange',render);
render();
